name: clinical-scribe-unified

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical-scribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinical}
      POSTGRES_DB: ${POSTGRES_DB:-clinical_scribe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinical} -d ${POSTGRES_DB:-clinical_scribe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock_ehr:
    build:
      context: .
      dockerfile: mock_ehr/Dockerfile
    container_name: clinical-scribe-mock-ehr
    restart: unless-stopped
    environment:
      EHR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinical}:${POSTGRES_PASSWORD:-clinical}@postgres:5432/mock_ehr
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  transcription:
    build:
      context: .
      dockerfile: services/transcription/Dockerfile
    container_name: clinical-scribe-transcription
    restart: unless-stopped
    environment:
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      ENABLE_EXTERNAL_LLM: ${ENABLE_EXTERNAL_LLM:-false}
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  clinical_nlp:
    build:
      context: .
      dockerfile: services/clinical_nlp/Dockerfile
    container_name: clinical-scribe-clinical-nlp
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      EXTRACTION_MODE: ${EXTRACTION_MODE:-auto}
      GENERATION_MODE: ${GENERATION_MODE:-auto}
      ALLOW_REMOTE_LLM: "false"
      REDACT_PHI_FOR_LLM: "true"
      TEAM_A_BASE_URL: http://transcription:8000
      STORE_PATH: /app/data/store/consultations.db
    volumes:
      - teamb_store:/app/data/store
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8001"
    depends_on:
      transcription:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: backend/dashboard/Dockerfile
    container_name: clinical-scribe-dashboard
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinical}:${POSTGRES_PASSWORD:-clinical}@postgres:5432/${POSTGRES_DB:-clinical_scribe}
      MOCK_EHR_URL: http://mock_ehr:8001
      TRANSCRIPTION_URL: http://transcription:8000
      CLINICAL_NLP_URL: http://clinical_nlp:8001
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080,http://localhost:3000,http://frontend:80"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock_ehr:
        condition: service_started
      transcription:
        condition: service_started
      clinical_nlp:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: clinical-scribe-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - dashboard

  ollama:
    image: ollama/ollama:latest
    container_name: clinical-scribe-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  teamb_store:
  ollama_data:

