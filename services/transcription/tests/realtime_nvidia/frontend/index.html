<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Scribe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========================================================
       Design preserved from AssemblyAI POC frontend.
       No provider branding in normal UI (Phase 33).
       Technical data kept in backend logs only.
       ======================================================== */
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;

      --doc-bg: rgba(30, 58, 138, 0.25);
      --doc-border: rgba(59, 130, 246, 0.35);
      --doc-text: #93c5fd;

      --pat-bg: rgba(6, 78, 59, 0.25);
      --pat-border: rgba(16, 185, 129, 0.35);
      --pat-text: #6ee7b7;

      --live-bg: rgba(51, 65, 85, 0.2);
      --live-border: rgba(148, 163, 184, 0.25);
      --live-text: #cbd5e1;

      --btn-start: #2563eb;
      --btn-start-hover: #1d4ed8;
      --btn-stop: #ef4444;
      --btn-stop-hover: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header {
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 15, 26, 0.4);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      transition: all 0.3s;
    }

    .status-dot.active {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s;
    }

    .btn-start { background: var(--btn-start); }
    .btn-start:hover { background: var(--btn-start-hover); }
    .btn-stop { background: var(--btn-stop); }
    .btn-stop:hover { background: var(--btn-stop-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .transcript-feed {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 340px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .empty-state .hint {
      margin-top: 12px;
      font-size: 0.8rem;
      opacity: 0.6;
    }

    /* Dialogue turn bubbles */
    .turn-bubble {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.2s ease-out;
      transition: background 0.3s, border-color 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .turn-bubble.doctor {
      align-self: flex-start;
      background: var(--doc-bg);
      border: 1px solid var(--doc-border);
      border-bottom-left-radius: 4px;
    }

    .turn-bubble.patient {
      align-self: flex-end;
      background: var(--pat-bg);
      border: 1px solid var(--pat-border);
      border-bottom-right-radius: 4px;
    }

    .turn-bubble.unassigned {
      align-self: flex-start;
      background: var(--live-bg);
      border: 1px dashed var(--live-border);
    }

    .turn-header {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .doctor   .turn-header { color: var(--doc-text); }
    .patient  .turn-header { color: var(--pat-text); }
    .unassigned .turn-header { color: var(--live-text); }

    .live-indicator {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      text-transform: none;
      font-weight: 400;
    }

    .turn-text {
      color: var(--text);
      font-size: 0.95rem;
      word-break: break-word;
    }

    .turn-bubble.live .turn-text::after {
      content: " ▊";
      animation: blink 1s infinite;
      color: var(--muted);
      font-size: 0.85em;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .transcript-feed::-webkit-scrollbar { width: 6px; }
    .transcript-feed::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    /* Error banner */
    .error-banner {
      margin: 8px 28px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-left">
        <div id="statusDot" class="status-dot"></div>
        <h1>Clinical Scribe</h1>
      </div>
      <div class="controls">
        <button id="actionBtn" class="btn btn-start" onclick="toggleSession()">
          <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span id="btnLabel">Start Conversation</span>
        </button>
      </div>
    </header>

    <div id="errorBanner" class="error-banner"></div>

    <div id="transcriptFeed" class="transcript-feed">
      <div id="emptyState" class="empty-state">
        Click <strong>Start Conversation</strong> to begin.
        <br>
        The clinical consultation will transcribe live with Doctor and Patient attribution.
        <div class="hint">Local inference — no internet required</div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // State
    // ============================================================
    let isRunning = false;
    let sessionId = null;
    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let scriptNode = null;
    const SAMPLE_RATE = 16000;

    const actionBtn   = document.getElementById('actionBtn');
    const btnLabel    = document.getElementById('btnLabel');
    const statusDot   = document.getElementById('statusDot');
    const transcriptFeed = document.getElementById('transcriptFeed');
    const emptyState  = document.getElementById('emptyState');
    const errorBanner = document.getElementById('errorBanner');

    // ============================================================
    // Session Control
    // ============================================================

    async function toggleSession() {
      if (!isRunning) { await startSession(); }
      else             { await stopSession();  }
    }

    async function startSession() {
      try {
        actionBtn.disabled = true;
        btnLabel.textContent = 'Connecting...';
        hideError();

        // 1. Initialize session on backend
        const res = await fetch('/test/realtime/start', { method: 'POST' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showError(
            'Cannot connect to NVIDIA runtime. ' +
            (err.detail || '') +
            ' — Start NeMo-Speech.cpp first: run_nemo_server.bat'
          );
          resetBtn();
          return;
        }
        const data = await res.json();
        sessionId = data.session_id;

        // 2. Open local WebSocket
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${window.location.host}/test/realtime/${sessionId}/stream`);

        ws.onopen = async () => {
          await initAudioCapture();
          isRunning = true;
          actionBtn.disabled = false;
          actionBtn.className = 'btn btn-stop';
          btnLabel.textContent = 'Stop Conversation';
          statusDot.classList.add('active');
          if (emptyState) emptyState.style.display = 'none';
        };

        ws.onmessage = (event) => {
          try {
            const ev = JSON.parse(event.data);
            if (ev.type === 'segment_update' && ev.segment) {
              updateSegment(ev.segment);
            } else if (ev.type === 'speaker_revision' && ev.segment) {
              updateSegment(ev.segment);  // In-place speaker label update
            } else if (ev.type === 'final_summary' && ev.all_segments) {
              ev.all_segments.forEach(updateSegment);
            } else if (ev.type === 'session_status') {
              console.log('[Session]', ev.message);
            } else if (ev.type === 'error') {
              showError(ev.message || 'Runtime error');
            }
          } catch (e) {
            console.warn('[WS parse]', e);
          }
        };

        ws.onerror = (err) => {
          console.error('[WS error]', err);
        };

        ws.onclose = () => {
          cleanupAudio();
          isRunning = false;
          resetBtn();
          statusDot.classList.remove('active');
        };

      } catch (err) {
        showError('Microphone or connection error: ' + err.message);
        resetBtn();
      }
    }

    // ============================================================
    // Audio Capture (PCM16 16kHz mono → binary WebSocket frames)
    // Preserved from AssemblyAI POC
    // ============================================================

    async function initAudioCapture() {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: SAMPLE_RATE,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        }
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)({
        sampleRate: SAMPLE_RATE
      });

      const source = audioContext.createMediaStreamSource(mediaStream);
      // 2048 samples = ~128ms at 16kHz (must be power of two)
      scriptNode = audioContext.createScriptProcessor(2048, 1, 1);

      scriptNode.onaudioprocess = (e) => {
        if (!isRunning || !ws || ws.readyState !== WebSocket.OPEN) return;
        const input = e.inputBuffer.getChannelData(0);

        // Float32 → Int16 PCM conversion
        const pcm16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        ws.send(pcm16.buffer);
      };

      source.connect(scriptNode);
      scriptNode.connect(audioContext.destination);
    }

    // ============================================================
    // Transcript Rendering (in-place DOM update by segment_id)
    // Phase 20: partial updates replace previous hypothesis in-place
    // Phase 21: FINAL replaces LIVE — no duplication
    // Phase 32: No provider branding visible
    // ============================================================

    function updateSegment(seg) {
      if (!seg || (!seg.text && seg.status !== 'FINAL')) return;
      if (emptyState) emptyState.style.display = 'none';

      let el = document.getElementById(seg.segment_id);
      const role      = (seg.role || 'Speaking...').trim();
      const roleLower = role.toLowerCase();

      // Point 5: "Speaking..." is the neutral LIVE label — render as live bubble
      let roleClass;
      if (roleLower.includes('doc')) {
        roleClass = 'doctor';
      } else if (roleLower.includes('pat')) {
        roleClass = 'patient';
      } else {
        roleClass = 'unassigned';  // covers "Speaking...", "Unassigned", unknown
      }

      const isLive = seg.status === 'LIVE';

      if (!el) {
        el = document.createElement('div');
        el.id = seg.segment_id;
        transcriptFeed.appendChild(el);
      }

      // Show role label: hide "Speaking..." on final segments, show Doctor/Patient
      const showRole = (!isLive && role !== 'Speaking...' && role !== 'Unassigned')
                        ? role
                        : (isLive ? 'Speaking...' : role);

      el.className = `turn-bubble ${roleClass}${isLive ? ' live' : ''}`;
      el.innerHTML = `
        <div class="turn-header">
          <span>${escapeHtml(showRole)}</span>
          ${isLive ? '<span class="live-indicator">speaking\u2026</span>' : ''}
        </div>
        <div class="turn-text">${escapeHtml(seg.text || '')}</div>
      `;

      transcriptFeed.scrollTop = transcriptFeed.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ============================================================
    // Stop (Phase 34)
    // ============================================================

    async function stopSession() {
      actionBtn.disabled = true;
      btnLabel.textContent = 'Finalizing…';
      statusDot.classList.remove('active');

      cleanupAudio();

      // Send stop command over WebSocket (triggers graceful flush)
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'stop' }));
      }

      // Belt-and-suspenders: also hit stop endpoint
      if (sessionId) {
        try {
          const res = await fetch(`/test/realtime/${sessionId}/stop`, { method: 'POST' });
          const data = await res.json();
          // Final segments might arrive here if WS already closed
          if (data.segments) {
            data.segments.forEach(updateSegment);
          }
        } catch (e) {
          console.warn('[Stop endpoint]', e);
        }
      }

      isRunning = false;
      resetBtn();
    }

    function cleanupAudio() {
      if (scriptNode)   { scriptNode.disconnect(); scriptNode = null; }
      if (mediaStream)  { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (audioContext) { audioContext.close(); audioContext = null; }
    }

    function resetBtn() {
      actionBtn.disabled = false;
      actionBtn.className = 'btn btn-start';
      btnLabel.textContent = 'Start Conversation';
    }

    // ============================================================
    // Error display
    // ============================================================

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    function hideError() {
      errorBanner.style.display = 'none';
      errorBanner.textContent = '';
    }
  </script>
</body>
</html>
